<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Neon Snake — PLAYGROUND</title>
  <meta name="theme-color" content="#05030f">
  <link rel="stylesheet" href="../../style.css">
  <style>
    .hud {
      display: flex;
      gap: 30px;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .hud b {
      color: var(--cyan);
      font-weight: 700;
      text-shadow: 0 0 14px rgba(0, 240, 255, 0.8);
    }
    .hud .best b {
      color: var(--magenta);
      text-shadow: 0 0 14px rgba(255, 43, 214, 0.8);
    }

    .board {
      position: relative;
      border-radius: 16px;
      padding: 8px;
      background: rgba(11, 7, 32, 0.75);
      border: 1px solid var(--line);
      box-shadow:
        0 0 0 1px rgba(0, 240, 255, 0.10),
        0 30px 70px -30px rgba(0, 240, 255, 0.55),
        inset 0 0 60px -20px rgba(122, 60, 255, 0.7);
    }

    canvas { display: block; border-radius: 10px; touch-action: none; }

    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      text-align: center;
      border-radius: 16px;
      background: rgba(5, 3, 15, 0.82);
      backdrop-filter: blur(3px);
      transition: opacity 0.25s;
    }

    .overlay.hidden { opacity: 0; pointer-events: none; }

    .overlay h2 {
      margin: 0;
      font-size: clamp(22px, 5vw, 34px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 34px var(--cyan);
    }

    .overlay p {
      margin: 0;
      max-width: 300px;
      font-size: 12px;
      line-height: 1.9;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .btn {
      font-family: inherit;
      font-size: 12px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      cursor: pointer;
      padding: 13px 30px;
      color: #04121a;
      background: linear-gradient(100deg, var(--cyan), var(--violet));
      border: none;
      border-radius: 999px;
      font-weight: 700;
      box-shadow: 0 0 30px -6px rgba(0, 240, 255, 0.9);
      transition: transform 0.18s, box-shadow 0.18s;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 44px -4px rgba(0, 240, 255, 1);
    }

    .btn:active { transform: translateY(0); }

    .pads {
      display: none;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(3, 60px);
      gap: 8px;
      margin-top: 6px;
    }

    .pads button {
      font-family: inherit;
      font-size: 18px;
      color: var(--cyan);
      background: rgba(11, 7, 32, 0.85);
      border: 1px solid var(--line);
      border-radius: 12px;
      cursor: pointer;
    }

    .pads button:active { background: rgba(0, 240, 255, 0.18); }

    .pads .up    { grid-area: 1 / 2; }
    .pads .left  { grid-area: 2 / 1; }
    .pads .right { grid-area: 2 / 3; }
    .pads .down  { grid-area: 3 / 2; }

    body.touch .pads { display: grid; }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="vignette"></div>

  <a class="back" href="../../">← назад</a>

  <div class="stage">

    <h1 class="title-neon">Neon Snake</h1>

    <div class="hud">
      <span>счёт <b id="score">0</b></span>
      <span>уровень <b id="level">1</b></span>
      <span class="best">рекорд <b id="best">0</b></span>
    </div>

    <div class="board">
      <canvas id="game"></canvas>
      <div class="overlay" id="overlay">
        <h2 id="ovTitle">Готов?</h2>
        <p id="ovText">Стрелки или WASD — движение. Пробел — пауза. Собирай кубики, не врезайся в стены и в себя.</p>
        <button class="btn" id="startBtn">начать</button>
      </div>
    </div>

    <div class="pads">
      <button class="up"    data-dir="up">▲</button>
      <button class="left"  data-dir="left">◀</button>
      <button class="right" data-dir="right">▶</button>
      <button class="down"  data-dir="down">▼</button>
    </div>

    <p class="hint">пробел — <b>пауза</b> · R — <b>заново</b></p>

  </div>

  <script src="game.js"></script>
</body>
</html>
