<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Shared Field — PLAYGROUND</title>
  <meta name="theme-color" content="#05030f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%2305030f'/><circle cx='11' cy='13' r='3.4' fill='%2300f0ff'/><circle cx='21' cy='19' r='3.4' fill='%23ff2bd6'/><path d='M13 15 L19 18' stroke='%237a3cff' stroke-width='1.6'/></svg>">
  <link rel="stylesheet" href="../../style.css">
  <style>
    html, body { overflow: hidden; height: 100%; }
    #field {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      touch-action: none;
      cursor: none;
    }

    /* верхняя панель: комната, статус, счёт игроков */
    .bar {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 9px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(11, 7, 32, 0.72);
      backdrop-filter: blur(8px);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      max-width: calc(100vw - 32px);
    }

    .bar .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--muted);
      box-shadow: 0 0 10px currentColor;
    }
    .bar .dot.on    { background: var(--lime);   color: var(--lime); }
    .bar .dot.wait  { background: #ffb300;       color: #ffb300; }
    .bar .dot.off   { background: var(--magenta);color: var(--magenta); }

    .bar b { color: var(--cyan); font-weight: 700; }

    .bar button {
      font-family: inherit;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 6px 12px;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--line);
      border-radius: 999px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .bar button:hover { color: var(--cyan); border-color: rgba(0, 240, 255, 0.6); }

    /* вход: имя */
    .gate {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 24px;
      text-align: center;
      background: rgba(5, 3, 15, 0.88);
      backdrop-filter: blur(6px);
      transition: opacity 0.3s;
    }
    .gate.hidden { opacity: 0; pointer-events: none; }

    .gate h2 {
      margin: 0;
      font-size: clamp(22px, 5vw, 34px);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #fff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 34px var(--cyan);
    }

    .gate p {
      margin: 0;
      max-width: 380px;
      font-size: 12px;
      line-height: 1.9;
      color: var(--muted);
    }

    .gate .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

    .gate input {
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.1em;
      width: 220px;
      padding: 12px 16px;
      color: var(--text);
      background: rgba(5, 3, 15, 0.9);
      border: 1px solid var(--line);
      border-radius: 10px;
      outline: none;
    }
    .gate input:focus { border-color: rgba(0, 240, 255, 0.7); box-shadow: 0 0 24px -8px var(--cyan); }

    .hintline {
      position: fixed;
      bottom: 18px;
      left: 0;
      right: 0;
      z-index: 5;
      text-align: center;
      font-size: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(138, 134, 184, 0.55);
      pointer-events: none;
    }
  </style>
</head>
<body>

  <canvas id="field"></canvas>

  <a class="back" href="../../">← назад</a>

  <div class="bar">
    <span class="dot wait" id="statusDot"></span>
    <span id="statusText">подключение…</span>
    <span>игроков: <b id="count">1</b></span>
    <span>комната: <b id="roomName">lobby</b></span>
    <button id="copyBtn">ссылку другу</button>
  </div>

  <div class="gate" id="gate">
    <h2>Shared Field</h2>
    <p>Общий экран. Все, кто зайдёт в эту комнату, видят друг друга вживую.
       Води мышью — твоя точка ползёт за курсором. Толкайся с другими.</p>
    <div class="row">
      <input id="nameInput" maxlength="14" placeholder="как тебя звать" autocomplete="off">
      <button class="btn" id="enterBtn">войти</button>
    </div>
  </div>

  <p class="hintline" id="hint">пошевели мышью · на телефоне — води пальцем</p>

  <script type="module" src="field.js"></script>
</body>
</html>
