name: Публикация сайта

# Деплой статики через Actions вместо встроенного сборщика Pages:
# встроенный начал падать с ошибкой «Page build failed» без подробностей,
# а здесь видно каждый шаг и артефакт собирается как есть, без переработки.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Забрать файлы репозитория
        uses: actions/checkout@v4

      - name: Подготовить Pages
        uses: actions/configure-pages@v5

      - name: Собрать артефакт
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Опубликовать
        id: deployment
        uses: actions/deploy-pages@v4
